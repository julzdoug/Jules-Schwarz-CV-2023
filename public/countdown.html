<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Countdown</title>
  <style>
    :root {
      --primary-color: #007bff;
      --dark-color: #2c3e50;
      --accent-color: #3498db;
      --success-color: #27ae60;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, var(--dark-color) 0%, var(--accent-color) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    /* === Animations === */
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      }
      50% {
        box-shadow: 0 0 40px rgba(52, 152, 219, 0.6);
      }
    }

    @keyframes rotateIn {
      from {
        opacity: 0;
        transform: rotate(-180deg) scale(0.5);
      }
      to {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes countdown-number {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: scale(0.8);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    /* === Background Circles === */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
      animation: float 8s ease-in-out infinite;
    }

    .circle-2 {
      width: 200px;
      height: 200px;
      bottom: -50px;
      left: -50px;
      animation: float 10s ease-in-out infinite 1s;
    }

    /* === Container === */
    .container {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      animation: slideInDown 0.8s ease-out;
    }

    .subtitle {
      font-size: 1.3rem;
      font-weight: 300;
      margin-bottom: 3rem;
      opacity: 0.95;
      animation: slideInDown 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    /* === Countdown Display === */
    .countdown-wrapper {
      animation: slideInUp 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }

    .countdown-circle {
      width: 250px;
      height: 250px;
      margin: 0 auto 2rem;
      background: rgba(255, 255, 255, 0.1);
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: glow 2s ease-in-out infinite;
    }

    .countdown-number {
      font-size: 5rem;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 5px;
      animation: rotateIn 0.6s ease-out;
    }

    .countdown-label {
      font-size: 1.2rem;
      font-weight: 300;
      margin-top: 2rem;
      opacity: 0.9;
    }

    /* === Progress Bar === */
    .progress-container {
      width: 100%;
      max-width: 400px;
      margin: 3rem auto 0;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color) 0%, var(--success-color) 100%);
      border-radius: 10px;
      transition: width 0.3s ease;
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.8);
    }

    /* === Completion Message === */
    .completion-message {
      display: none;
      text-align: center;
      animation: slideInUp 0.8s ease-out;
    }

    .completion-message.show {
      display: block;
    }

    .completion-message h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: pulse 1s ease-in-out infinite;
    }

    .completion-message p {
      font-size: 1.3rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .redirect-info {
      font-size: 1.1rem;
      margin-top: 2rem;
      opacity: 0.8;
      animation: slideInUp 0.8s ease-out 0.3s forwards;
      opacity: 0;
    }

    /* === Confetti Effect === */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #FFD700;
      pointer-events: none;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      .title {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .countdown-circle {
        width: 200px;
        height: 200px;
      }

      .countdown-number {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Background Decorations -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <!-- Main Container -->
  <div class="container">
    <h1 class="title">Web Development</h1>
    <p class="subtitle">Launching in...</p>

    <!-- Countdown Section -->
    <div class="countdown-wrapper" id="countdownWrapper">
      <div class="countdown-circle">
        <div class="countdown-number" id="countdownNumber">10</div>
      </div>
      <p class="countdown-label">Seconds</p>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 100%;"></div>
      </div>
    </div>

    <!-- Completion Message -->
    <div class="completion-message" id="completionMessage">
      <h2>🎉</h2>
      <p>Get Ready for Amazing Web Development!</p>
      <p class="redirect-info">Redirecting you back in 3 seconds...</p>
    </div>
  </div>

  <script>
    const countdownNumber = document.getElementById('countdownNumber');
    const progressBar = document.getElementById('progressBar');
    const countdownWrapper = document.getElementById('countdownWrapper');
    const completionMessage = document.getElementById('completionMessage');
    const container = document.querySelector('.container');

    let currentCount = 10;
    const totalCount = 10;

    function createConfetti() {
      const colors = ['#FFD700', '#FF6B9D', '#4ECDC4', '#45B7D1', '#FFA07A'];
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animation = `fall ${2 + Math.random() * 2}s ease-in forwards`;
        document.body.appendChild(confetti);
      }
    }

    function startCountdown() {
      const countInterval = setInterval(() => {
        // Update number with animation
        countdownNumber.style.animation = 'none';
        setTimeout(() => {
          countdownNumber.style.animation = 'countdown-number 1s ease-out';
        }, 10);

        currentCount--;

        // Update progress bar
        const progress = ((totalCount - currentCount) / totalCount) * 100;
        progressBar.style.width = (100 - progress) + '%';

        if (currentCount < 0) {
          clearInterval(countInterval);
          completeCountdown();
        } else {
          countdownNumber.textContent = currentCount;
        }
      }, 1000);
    }

    function completeCountdown() {
      countdownWrapper.style.display = 'none';
      completionMessage.classList.add('show');

      // Create confetti effect
      createConfetti();

      // Redirect after 3 seconds
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    }

    // Add CSS for confetti fall animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    // Start the countdown
    startCountdown();
  </script>
</body>
</html>
